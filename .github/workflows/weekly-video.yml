name: Daily studio

on:
  schedule:
    - cron: "17 4 * * *"   # every day 04:17 UTC; each channel only runs on its own days (see channels.json)
  workflow_dispatch:
    inputs:
      channel:
        description: "Run one channel now (kids, stories or explainers); leave empty to follow the schedule"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core libcairo2
      - run: pip install -r requirements.txt
      - name: Run studio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HINDI_FONT: /usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf
          UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'package' }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          NICHE: ${{ vars.NICHE || 'everyday money, rules, rights and how things work in India' }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          YT_TOKEN_KIDS: ${{ secrets.YT_TOKEN_KIDS }}
          YT_TOKEN_STORIES: ${{ secrets.YT_TOKEN_STORIES }}
          YT_TOKEN_EXPLAINERS: ${{ secrets.YT_TOKEN_EXPLAINERS }}
        run: python studio.py run ${{ github.event.inputs.channel }}
      - name: Save history
        if: always()
        run: |
          git config user.name "video-bot" && git config user.email "video-bot@users.noreply.github.com"
          [ -d state ] && git add state
          git diff --cached --quiet || (git commit -m "Update episode history" && git pull --rebase -q origin main && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ github.run_number }}
          path: output/*/package
          retention-days: 30
