name: Preview pictures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: pip install Pillow
      - name: Make sample pictures
        env:
          HINDI_FONT: /usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python story.py preview
      - name: Save pictures to the repo
        run: |
          git config user.name "video-bot" && git config user.email "video-bot@users.noreply.github.com"
          git add -f preview/*.png
          git diff --cached --quiet || (git commit -m "Preview pictures" && git pull --rebase -q origin main && git push)
